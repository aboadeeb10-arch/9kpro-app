          tag_name: desktop
          name: 9K Pro TV for Windows / Mac
          body: "Windows: 9KProTV-Setup.msi · Mac Apple Silicon: 9KProTV-mac-arm.dmg · Mac Intel: 9KProTV-mac-intel.dmg"
